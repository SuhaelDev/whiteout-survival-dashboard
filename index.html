<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whiteout Survival Personal Dashboard</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="src/styles.css?v=20260731-wave43c" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Module navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">W</span>
          <div>
            <strong>Whiteout Tracker</strong>
            <span>Plan your next upgrade</span>
          </div>
        </div>
        <nav class="module-nav" id="moduleNav"></nav>
        <div class="save-panel">
          <span id="saveStatus">Loading data</span>
          <div class="cloud-sync-panel" id="accountPanel">
            <span class="cloud-sync-title">Account</span>
            <span id="cloudSyncStatus">Starting up</span>
          </div>
          <details class="sidebar-tools">
            <summary>Data &amp; reset</summary>
            <div class="sidebar-tools__body">
              <button type="button" id="exportState">Export a backup</button>
              <label class="file-button">
                Import a backup
                <input id="importState" type="file" accept="application/json" />
              </label>
              <button type="button" id="openWizard">Re-run setup</button>
              <button type="button" id="resetTargets">Clear my targets</button>
              <button type="button" id="resetState" class="danger">Reset everything</button>
            </div>
          </details>
        </div>
      </aside>

      <main class="main">
        <section class="hero-band">
          <img src="assets/frost-command-dashboard.png" alt="" />
          <div class="hero-content">
            <h1>Your Whiteout Progress</h1>
            <div class="profile-grid" id="profileInputs"></div>
          </div>
        </section>

        <section class="content-area">
          <div class="tab-panel active" id="tab-overview"></div>
          <div class="tab-panel" id="tab-planner"></div>
          <div class="tab-panel" id="tab-inventory"></div>
          <div class="tab-panel" id="tab-buildings"></div>
          <div class="tab-panel" id="tab-chief-gear"></div>
          <div class="tab-panel" id="tab-charms"></div>
          <div class="tab-panel" id="tab-heroes"></div>
          <div class="tab-panel" id="tab-hero-gear"></div>
          <div class="tab-panel" id="tab-pets"></div>
          <div class="tab-panel" id="tab-experts"></div>
          <div class="tab-panel" id="tab-research"></div>
          <div class="tab-panel" id="tab-t12-research"></div>
          <div class="tab-panel" id="tab-troops"></div>
          <div class="tab-panel" id="tab-svs"></div>
          
          <div class="tab-panel" id="tab-skins"></div>
          <div class="tab-panel" id="tab-sources"></div>
        </section>
      </main>
    </div>

    <template id="errorTemplate">
      <div class="empty-state">
        <h2>Data could not load</h2>
        <p>Start a local web server from this folder so the JSON files can be fetched.</p>
      </div>
    </template>

    <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="src/app.js?v=20260731-wave43c"></script>
  </body>
</html>
