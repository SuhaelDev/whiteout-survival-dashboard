    <!-- viewport-fit=cover lets the layout reach under the notch and home indicator;
         mobile.css pays that back with env(safe-area-inset-*) padding. Pinch zoom is
         deliberately left enabled - 16px form controls are what stop iOS auto-zooming,
         not a maximum-scale lock. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Whiteout Survival Personal Dashboard</title>
    <meta name="description" content="Personal Whiteout Survival progress dashboard: plan upgrades, track inventory, and see what to build next." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Whiteout" />
    <!-- black-translucent puts the app behind the status bar; mobile.css reserves
         env(safe-area-inset-top) so nothing actually renders under the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Numbers in the tables are quantities, not phone numbers. -->
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no" />

    <!-- Sets the shell flag before first paint so a phone never flashes the
         desktop layout. mobile.js re-evaluates the identical predicate on
         resize/rotate - keep the two copies in step. -->
    <script>
      (function () {
        try {
          var forced = new URLSearchParams(location.search).get("shell");
          if (forced !== "mobile" && forced !== "desktop") {
            var coarse =
              matchMedia("(hover: none) and (pointer: coarse)").matches ||
              navigator.maxTouchPoints > 1;
            var shortEdge = Math.min(innerWidth, innerHeight);
            forced = coarse && shortEdge <= 500 ? "mobile" : "desktop";
          }
          document.documentElement.dataset.shell = forced;
        } catch (e) {
          document.documentElement.dataset.shell = "desktop";
        }
      })();
    </script>

  <body>
    <a class="skip-link" href="#tab-overview">Skip to content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Module navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">W</span>
          <div>
            <strong>Whiteout Tracker</strong>
            <span>Plan your next upgrade</span>
          </div>
        </div>
        <nav class="module-nav" id="moduleNav"></nav>
        <div class="save-panel">
          <span id="saveStatus" role="status" aria-live="polite">Loading data</span>
          <div class="cloud-sync-panel" id="accountPanel">
            <span class="cloud-sync-title">Account</span>
            <span id="cloudSyncStatus">Starting up</span>
          </div>
          <details class="sidebar-tools">
            <summary>Data &amp; reset</summary>
            <div class="sidebar-tools__body">
              <button type="button" id="exportState">Export a backup</button>
              <label class="file-button">
                Import a backup
                <input id="importState" type="file" accept="application/json" />
              </label>
              <button type="button" id="openWizard">Re-run setup</button>
              <button type="button" id="resetTargets">Clear my targets</button>
              <button type="button" id="resetState" class="danger">Reset everything</button>
            </div>
          </details>
        </div>
      </aside>

      <main class="main">
        <section class="hero-band">
          <!-- display:contents keeps <picture> out of the box tree, so the
               <img> stays the hero band's only flex child exactly as before
               and desktop's box geometry is untouched. -->
          <picture style="display: contents">
            <!-- Phones get a 1100px WebP (48 KB) or JPEG (58 KB) instead of the
                 2.2 MB PNG. Desktop deliberately keeps the original PNG so its
                 rendering stays bit-identical to before. -->
            <source media="(max-width: 820px)" type="image/webp" srcset="assets/frost-command-dashboard-mobile.webp" />
            <source media="(max-width: 820px)" srcset="assets/frost-command-dashboard-mobile.jpg" />
            <!-- Desktop used to pull the 2.27 MB PNG - 85% of a 2.67 MB cold
                 load - to paint a 236px strip. Same image, 167 KB. The PNG
                 stays as the fallback for anything without WebP. -->
            <source type="image/webp" srcset="assets/frost-command-dashboard.webp" />
            <img src="assets/frost-command-dashboard.png" alt="" />
          </picture>
          <div class="hero-content">
            <h1>Your Whiteout Progress</h1>
            <div class="profile-grid" id="profileInputs"></div>
          </div>
        </section>

        <section class="content-area">
          <div class="tab-panel active" id="tab-overview"></div>
          <div class="tab-panel" id="tab-planner"></div>
          <div class="tab-panel" id="tab-inventory"></div>
          <div class="tab-panel" id="tab-buildings"></div>
          <div class="tab-panel" id="tab-chief-gear"></div>
          <div class="tab-panel" id="tab-charms"></div>
          <div class="tab-panel" id="tab-heroes"></div>
          <div class="tab-panel" id="tab-hero-gear"></div>
          <div class="tab-panel" id="tab-pets"></div>
          <div class="tab-panel" id="tab-experts"></div>
          <div class="tab-panel" id="tab-research"></div>
          <div class="tab-panel" id="tab-t12-research"></div>
          <div class="tab-panel" id="tab-troops"></div>
          <div class="tab-panel" id="tab-svs"></div>

          <div class="tab-panel" id="tab-skins"></div>
          <div class="tab-panel" id="tab-sources"></div>
        </section>
      </main>
    </div>

    <template id="errorTemplate">
      <div class="empty-state">
        <h2>Data could not load</h2>
        <p>Start a local web server from this folder so the JSON files can be fetched.</p>
      </div>
    </template>
